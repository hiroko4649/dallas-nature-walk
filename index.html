<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダラス散歩 — 花と鳥のデータベース</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --moss:     #4a6741;
      --sage:     #7a9e6e;
      --sage-lt:  #b8d4a8;
      --sage-bg:  #edf5e8;
      --sky:      #3d7ab5;
      --sky-lt:   #a8c8e8;
      --sky-bg:   #e6f0f8;
      --cream:    #faf7f0;
      --warm:     #f0ebe0;
      --ink:      #2a2a22;
      --muted:    #7a7a6a;
      --border:   #ddd8cc;
      --shadow:   rgba(60,60,40,0.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ─── HEADER ─── */
    header {
      background: var(--moss);
      color: #fff;
      padding: 1.4rem 1.5rem 1.2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Ccircle cx='30' cy='30' r='4'/%3E%3Ccircle cx='10' cy='10' r='2'/%3E%3Ccircle cx='50' cy='10' r='2'/%3E%3Ccircle cx='10' cy='50' r='2'/%3E%3Ccircle cx='50' cy='50' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    header h1 {
      font-family: 'Lora', serif;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      position: relative;
    }
    header p {
      font-size: 0.78rem;
      opacity: 0.75;
      margin-top: 0.3rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      position: relative;
    }

    /* ─── TABS ─── */
    .tab-bar {
      display: flex;
      max-width: 860px;
      margin: 1.5rem auto 0;
      padding: 0 1.2rem;
      gap: 0.6rem;
    }
    .tab {
      flex: 1;
      padding: 0.65rem 1rem;
      border-radius: 10px;
      border: 2px solid var(--sage);
      background: #fff;
      color: var(--sage);
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
    }
    .tab:hover { background: var(--sage-bg); }
    .tab.active { background: var(--sage); color: #fff; border-color: var(--sage); }
    .tab.bird-tab { border-color: var(--sky); color: var(--sky); }
    .tab.bird-tab:hover { background: var(--sky-bg); }
    .tab.bird-tab.active { background: var(--sky); color: #fff; border-color: var(--sky); }

    /* ─── TOOLBAR ─── */
    .toolbar {
      max-width: 860px;
      margin: 1rem auto 0;
      padding: 0 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .count-label {
      font-size: 0.85rem;
      color: var(--muted);
      font-style: italic;
    }
    .add-btn {
      background: var(--moss);
      color: #fff;
      border: none;
      padding: 0.55rem 1.2rem;
      border-radius: 8px;
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.03em;
    }
    .add-btn:hover { background: var(--sage); }
    .add-btn:active { transform: scale(0.97); }

    /* ─── CARDS GRID ─── */
    .cards {
      max-width: 860px;
      margin: 1rem auto 3rem;
      padding: 0 1.2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 10px var(--shadow);
      border: 1px solid var(--border);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: fadeUp 0.35s ease both;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(60,60,40,0.15);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-img-wrap {
      width: 100%;
      height: 170px;
      overflow: hidden;
      position: relative;
    }
    .card-img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .card:hover .card-img { transform: scale(1.04); }
    .card-placeholder {
      width: 100%; height: 170px;
      display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem;
      background: linear-gradient(135deg, var(--sage-bg), #d4ebc8);
    }
    .card.bird .card-placeholder {
      background: linear-gradient(135deg, var(--sky-bg), #ccdff0);
    }

    .card-body { padding: 0.85rem 1rem 0.75rem; }
    .card-jp   { font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
    .card-en   { font-family: 'Lora', serif; font-style: italic; font-size: 0.83rem; color: var(--muted); margin-top: 0.1rem; }
    .card-sci  { font-family: 'Lora', serif; font-style: italic; font-size: 0.73rem; color: #aaa; margin-top: 0.05rem; }

    .card-meta {
      margin-top: 0.5rem;
      display: flex; flex-wrap: wrap; gap: 0.3rem 0.8rem;
      font-size: 0.75rem; color: var(--muted);
    }
    .card-memo {
      margin-top: 0.4rem;
      font-size: 0.78rem;
      color: #555;
      line-height: 1.5;
      border-left: 2px solid var(--sage-lt);
      padding-left: 0.5rem;
    }
    .card.bird .card-memo { border-color: var(--sky-lt); }

    .card-actions {
      display: flex; gap: 0.4rem;
      margin-top: 0.65rem;
    }
    .btn-edit, .btn-del {
      flex: 1; padding: 0.32rem;
      border-radius: 6px; border: none;
      cursor: pointer; font-size: 0.75rem;
      font-family: 'Zen Maru Gothic', sans-serif;
      transition: background 0.15s;
    }
    .btn-edit { background: var(--warm); color: #555; }
    .btn-edit:hover { background: #e4ddd0; }
    .btn-del  { background: #fce8e8; color: #b00; }
    .btn-del:hover  { background: #f8d0d0; }

    /* ─── MODAL ─── */
    .modal-bg {
      display: none;
      position: fixed; inset: 0;
      background: rgba(30,35,20,0.55);
      backdrop-filter: blur(3px);
      z-index: 200;
      align-items: center; justify-content: center;
      padding: 1rem;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--cream);
      border-radius: 18px;
      padding: 1.8rem 1.6rem 1.5rem;
      width: 100%; max-width: 460px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      animation: modalIn 0.25s ease;
    }
    @keyframes modalIn {
      from { opacity:0; transform: scale(0.95) translateY(10px); }
      to   { opacity:1; transform: scale(1) translateY(0); }
    }
    .modal h2 {
      font-family: 'Lora', serif;
      font-size: 1.15rem;
      margin-bottom: 1.2rem;
      color: var(--moss);
    }
    .modal.bird-mode h2 { color: var(--sky); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .form-group { margin-bottom: 0.75rem; }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 0.28rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.52rem 0.75rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 0.88rem;
      color: var(--ink);
      transition: border-color 0.2s;
      outline: none;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--sage);
    }
    .bird-mode .form-group input:focus,
    .bird-mode .form-group textarea:focus {
      border-color: var(--sky);
    }
    .form-group textarea { min-height: 72px; resize: vertical; line-height: 1.5; }

    .modal-actions { display: flex; gap: 0.75rem; margin-top: 1.3rem; }
    .btn-save {
      flex: 2;
      background: var(--moss);
      color: #fff;
      border: none; border-radius: 9px;
      padding: 0.7rem;
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 1rem; font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-save:hover { background: var(--sage); }
    .bird-mode .btn-save { background: var(--sky); }
    .bird-mode .btn-save:hover { background: #5592c8; }
    .btn-cancel {
      flex: 1;
      background: var(--warm);
      color: var(--muted);
      border: none; border-radius: 9px;
      padding: 0.7rem;
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 0.95rem; cursor: pointer;
      transition: background 0.15s;
    }
    .btn-cancel:hover { background: #e4ddd0; }

    /* ─── TOAST ─── */
    .toast {
      position: fixed; bottom: 1.8rem; right: 1.8rem;
      background: var(--ink); color: #fff;
      padding: 0.65rem 1.3rem;
      border-radius: 10px;
      font-size: 0.88rem;
      z-index: 300;
      opacity: 0; pointer-events: none;
      transform: translateY(6px);
      transition: opacity 0.3s, transform 0.3s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ─── LOADING / EMPTY ─── */
    .loading-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      font-style: italic;
    }

    /* ─── CATEGORY BADGE ─── */
    .badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      margin-bottom: 0.35rem;
      background: var(--sage-bg);
      color: var(--moss);
    }
    .card.bird .badge { background: var(--sky-bg); color: var(--sky); }

    @media (max-width: 480px) {
      .cards { grid-template-columns: 1fr 1fr; gap: 0.7rem; }
      .form-row { grid-template-columns: 1fr; gap: 0; }
      header h1 { font-size: 1.15rem; }
    }
    @media (max-width: 360px) {
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>🌿 ダラス散歩 花と鳥のデータベース</h1>
  <p>Dallas Nature Walk · Flowers &amp; Birds</p>
</header>

<div class="tab-bar">
  <button class="tab active" id="tab-flower" onclick="switchTab('flower')">🌸 花 · Flowers</button>
  <button class="tab bird-tab" id="tab-bird" onclick="switchTab('bird')">🐦 鳥 · Birds</button>
</div>

<div class="toolbar">
  <span class="count-label" id="count-label">読み込み中…</span>
  <button class="add-btn" onclick="openModal()">＋ 追加</button>
</div>

<div class="cards" id="cards-container">
  <div class="loading-state">データを読み込み中…</div>
</div>

<!-- ─── MODAL ─── -->
<div class="modal-bg" id="modal-bg" onclick="bgClick(event)">
  <div class="modal" id="modal-inner">
    <h2 id="modal-title">🌸 新しい花を追加</h2>
    <div class="form-row">
      <div class="form-group">
        <label>日本語名 *</label>
        <input id="f-jp" type="text" placeholder="例：サルスベリ">
      </div>
      <div class="form-group">
        <label>英語名 *</label>
        <input id="f-en" type="text" placeholder="例：Crape Myrtle">
      </div>
    </div>
    <div class="form-group">
      <label>学名</label>
      <input id="f-sci" type="text" placeholder="例：Lagerstroemia indica">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>見かけた日</label>
        <input id="f-date" type="date">
      </div>
      <div class="form-group">
        <label>場所</label>
        <input id="f-loc" type="text" placeholder="例：Katy Trail">
      </div>
    </div>
    <div class="form-group">
      <label>Google Drive 写真URL</label>
      <input id="f-img" type="url" placeholder="https://drive.google.com/file/d/.../view">
    </div>
    <div class="form-group">
      <label>メモ</label>
      <textarea id="f-memo" placeholder="気づいたことなど…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-save" onclick="saveEntry()">保存する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ─── Firebase ─── -->
<script type="module">
import { initializeApp }    from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove, update, get, child }
                            from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

/* ── Config ── */
const firebaseConfig = {
  apiKey:            "AIzaSyBL-1bIyHXWrkY1-YMfhffVTm_u6dmOHOI",
  authDomain:        "hiroko-nature-walk.firebaseapp.com",
  databaseURL:       "https://hiroko-nature-walk-default-rtdb.firebaseio.com",
  projectId:         "hiroko-nature-walk",
  storageBucket:     "hiroko-nature-walk.firebasestorage.app",
  messagingSenderId: "509197032139",
  appId:             "1:509197032139:web:c03d5bf069f80db74a994e",
  measurementId:     "G-0R054Q6ECR"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

/* ── Seed data ── */
const SEED_FLOWERS = [
  { jp:"ヒトツバタゴ",               en:"Fringe Tree",               sci:"Chionanthus retusus" },
  { jp:"ロッキーオダマキ",           en:"Rocky Mountain Columbine",  sci:"Aquilegia caerulea" },
  { jp:"マンデビラ",                 en:"Mandevilla",                sci:"Mandevilla spp." },
  { jp:"アンゲロニア",               en:"Angelonia",                 sci:"Angelonia angustifolia" },
  { jp:"カシワバアジサイ",           en:"Oakleaf Hydrangea",         sci:"Hydrangea quercifolia" },
  { jp:"セイヨウアジサイ",           en:"Bigleaf Hydrangea",         sci:"Hydrangea macrophylla" },
  { jp:"ヘメロカリス",               en:"Daylily",                   sci:"Hemerocallis spp." },
  { jp:"ミスティックスパイアーズ",   en:"Mystic Spires Blue Salvia", sci:"Salvia farinacea 'Mystic Spires'" },
  { jp:"オータムセージ",             en:"Autumn Sage",               sci:"Salvia greggii" },
  { jp:"メキシカンブッシュセージ",   en:"Mexican Bush Sage",         sci:"Salvia leucantha" },
  { jp:"ヒャクニチソウ",             en:"Zinnia",                    sci:"Zinnia elegans" },
  { jp:"アルテミシア",               en:"Artemisia",                 sci:"Artemisia spp." },
  { jp:"ケイトウ",                   en:"Celosia / Cockscomb",       sci:"Celosia argentea" },
  { jp:"センニチコウ",               en:"Globe Amaranth",            sci:"Gomphrena globosa" },
  { jp:"マンデビラ・レッドライディングフッド", en:"Mandevilla Red Riding Hood", sci:"Mandevilla sanderi 'Red Riding Hood'" },
  { jp:"ピンクポペット・ウェイゲラ", en:"Pink Poppet Weigela",       sci:"Weigela florida 'Pink Poppet'" },
  { jp:"ターク's キャップ",          en:"Turk's Cap",                sci:"Malvaviscus arboreus" },
  { jp:"セイヨウニンジンボク",       en:"Chaste Tree",               sci:"Vitex agnus-castus" },
  { jp:"サルスベリ",                 en:"Crape Myrtle",              sci:"Lagerstroemia indica" },
  { jp:"ホーリーバジル",             en:"Holy Basil (Tulsi)",        sci:"Ocimum tenuiflorum" },
  { jp:"レモンバジル",               en:"Lemon Basil",               sci:"Ocimum × citriodorum" },
];

const SEED_BIRDS = [
  { jp:"ホシムクドリ",           en:"European Starling",    sci:"Sturnus vulgaris" },
  { jp:"オナガクロムクドリモドキ",en:"Great-tailed Grackle", sci:"Quiscalus mexicanus" },
  { jp:"マネシツグミ",           en:"Northern Mockingbird", sci:"Mimus polyglottos" },
  { jp:"コマツグミ",             en:"American Robin",       sci:"Turdus migratorius" },
  { jp:"シロハラバト",           en:"White-winged Dove",    sci:"Zenaida asiatica" },
];

/* ── State ── */
let tab       = 'flower';
let allData   = { flower: {}, bird: {} };
let editKey   = null;

/* ── Google Drive URL converter ── */
function driveImgUrl(url) {
  if (!url) return null;
  const m = url.match(/\/file\/d\/([^/?#]+)/);
  if (m) return `https://lh3.googleusercontent.com/d/${m[1]}`;
  const m2 = url.match(/[?&]id=([^&]+)/);
  if (m2) return `https://lh3.googleusercontent.com/d/${m2[1]}`;
  return url;
}

/* ── Seed ── */
async function seedIfEmpty() {
  const snap = await get(child(ref(db), 'flowers'));
  if (!snap.exists()) {
    for (const f of SEED_FLOWERS)
      await push(ref(db,'flowers'), { ...f, date:'', location:'Dallas', img:'', memo:'', category:'flower' });
    for (const b of SEED_BIRDS)
      await push(ref(db,'birds'),   { ...b, date:'', location:'Dallas', img:'', memo:'', category:'bird'  });
    toast('初期データを追加しました ✓');
  }
}

/* ── Listeners ── */
function startListeners() {
  onValue(ref(db,'flowers'), s => {
    allData.flower = s.val() || {};
    if (tab === 'flower') render();
  });
  onValue(ref(db,'birds'), s => {
    allData.bird = s.val() || {};
    if (tab === 'bird') render();
  });
}

/* ── Render ── */
function render() {
  const container = document.getElementById('cards-container');
  const entries   = Object.entries(allData[tab]);
  const isFlower  = tab === 'flower';
  const emoji     = isFlower ? '🌸' : '🐦';

  document.getElementById('count-label').textContent =
    isFlower ? `🌸 花 ${entries.length}種類` : `🐦 鳥 ${entries.length}種類`;

  if (!entries.length) {
    container.innerHTML = `<div class="loading-state">データがありません</div>`;
    return;
  }

  container.innerHTML = entries.map(([key, item], i) => {
    const imgUrl = driveImgUrl(item.img);
    const delay  = Math.min(i * 0.04, 0.5);
    return `
      <div class="card ${isFlower ? '' : 'bird'}" style="animation-delay:${delay}s">
        <div class="card-img-wrap">
          ${imgUrl
            ? `<img class="card-img" src="${imgUrl}" alt="${item.jp}"
                    onerror="this.parentElement.innerHTML='<div class=\\'card-placeholder\\'>${emoji}</div>'">`
            : `<div class="card-placeholder">${emoji}</div>`}
        </div>
        <div class="card-body">
          <div class="badge">${isFlower ? 'Flower' : 'Bird'}</div>
          <div class="card-jp">${item.jp}</div>
          <div class="card-en">${item.en || ''}</div>
          <div class="card-sci">${item.sci || ''}</div>
          <div class="card-meta">
            ${item.date     ? `<span>📅 ${item.date}</span>` : ''}
            ${item.location ? `<span>📍 ${item.location}</span>` : ''}
          </div>
          ${item.memo ? `<div class="card-memo">${item.memo}</div>` : ''}
          <div class="card-actions">
            <button class="btn-edit" onclick="editEntry('${key}')">✏️ 編集</button>
            <button class="btn-del"  onclick="delEntry('${key}')">🗑️ 削除</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

/* ── Tab switch ── */
window.switchTab = function(t) {
  tab = t;
  document.getElementById('tab-flower').classList.toggle('active', t === 'flower');
  document.getElementById('tab-bird'  ).classList.toggle('active', t === 'bird'  );
  render();
};

/* ── Modal ── */
window.openModal = function() {
  editKey = null;
  clearForm();
  syncModalMode();
  document.getElementById('modal-bg').classList.add('open');
};

window.closeModal = function() {
  document.getElementById('modal-bg').classList.remove('open');
  editKey = null;
};

window.bgClick = function(e) {
  if (e.target === document.getElementById('modal-bg')) closeModal();
};

function syncModalMode() {
  const isFlower = tab === 'flower';
  const inner = document.getElementById('modal-inner');
  inner.classList.toggle('bird-mode', !isFlower);
  document.getElementById('modal-title').textContent =
    editKey
      ? (isFlower ? '🌸 花を編集' : '🐦 鳥を編集')
      : (isFlower ? '🌸 新しい花を追加' : '🐦 新しい鳥を追加');
}

function clearForm() {
  ['f-jp','f-en','f-sci','f-date','f-loc','f-img','f-memo']
    .forEach(id => document.getElementById(id).value = '');
}

window.editEntry = function(key) {
  const d = allData[tab][key];
  if (!d) return;
  editKey = key;
  document.getElementById('f-jp'  ).value = d.jp       || '';
  document.getElementById('f-en'  ).value = d.en       || '';
  document.getElementById('f-sci' ).value = d.sci      || '';
  document.getElementById('f-date').value = d.date     || '';
  document.getElementById('f-loc' ).value = d.location || '';
  document.getElementById('f-img' ).value = d.img      || '';
  document.getElementById('f-memo').value = d.memo     || '';
  syncModalMode();
  document.getElementById('modal-bg').classList.add('open');
};

window.delEntry = function(key) {
  if (!confirm('このデータを削除しますか？')) return;
  const path = tab === 'flower' ? 'flowers' : 'birds';
  remove(ref(db, `${path}/${key}`)).then(() => toast('削除しました'));
};

window.saveEntry = function() {
  const jp = document.getElementById('f-jp').value.trim();
  const en = document.getElementById('f-en').value.trim();
  if (!jp || !en) { alert('日本語名と英語名は必須です'); return; }

  const entry = {
    jp,
    en,
    sci:      document.getElementById('f-sci' ).value.trim(),
    date:     document.getElementById('f-date').value,
    location: document.getElementById('f-loc' ).value.trim(),
    img:      document.getElementById('f-img' ).value.trim(),
    memo:     document.getElementById('f-memo').value.trim(),
    category: tab,
  };

  const path = tab === 'flower' ? 'flowers' : 'birds';

  if (editKey) {
    update(ref(db, `${path}/${editKey}`), entry)
      .then(() => { toast('更新しました ✓'); closeModal(); });
  } else {
    push(ref(db, path), entry)
      .then(() => { toast('追加しました ✓'); closeModal(); });
  }
};

/* ── Toast ── */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2600);
}

/* ── Init ── */
seedIfEmpty().then(() => startListeners());
</script>
</body>
</html>
