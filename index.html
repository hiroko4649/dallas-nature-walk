<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダラス散歩 — 花と鳥のデータベース</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --moss:    #3d5e36;
      --sage:    #6b9660;
      --sage-lt: #b4d4a4;
      --sage-bg: #eaf3e4;
      --sky:     #3570a8;
      --sky-lt:  #9ec4e4;
      --sky-bg:  #e4eff8;
      --cream:   #faf7f0;
      --warm:    #f0ebe0;
      --ink:     #252520;
      --mid:     #505048;
      --muted:   #7a7a6a;
      --border:  #ddd8cc;
      --gold:    #c8960a;
      --shadow:  rgba(50,50,30,.10);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Zen Maru Gothic', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #2a4025 0%, var(--moss) 60%, #2d5535 100%);
      color: #fff; padding: 1.6rem 1.5rem 1.3rem; text-align: center; position: relative; overflow: hidden;
    }
    header::before { content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 80% 50%, rgba(255,255,255,.06) 0%, transparent 60%); }
    header h1 { font-family: 'Lora', serif; font-size: clamp(1.15rem,3.5vw,1.55rem); font-weight: 600; position: relative; }
    header p  { font-size: .75rem; opacity: .72; margin-top: .3rem; letter-spacing: .1em; text-transform: uppercase; position: relative; }
    .header-stats { display: flex; justify-content: center; gap: 1.2rem; margin-top: 1rem; flex-wrap: wrap; position: relative; }
    .stat-box { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
      border-radius: 9px; padding: .5rem 1.1rem; text-align: center; }
    .stat-num { font-size: 1.4rem; font-weight: 700; }
    .stat-lbl { font-size: .65rem; opacity: .8; letter-spacing: .06em; }

    /* TABS */
    .tab-bar { display: flex; max-width: 900px; margin: 1.4rem auto 0; padding: 0 1.1rem; gap: .6rem; }
    .tab { flex: 1; padding: .6rem 1rem; border-radius: 10px; border: 2px solid var(--sage);
      background: #fff; color: var(--sage); font-family: inherit; font-size: .9rem; font-weight: 700;
      cursor: pointer; transition: all .18s; }
    .tab:hover { background: var(--sage-bg); }
    .tab.active { background: var(--sage); color: #fff; }
    .tab.bird-tab { border-color: var(--sky); color: var(--sky); }
    .tab.bird-tab:hover { background: var(--sky-bg); }
    .tab.bird-tab.active { background: var(--sky); color: #fff; }

    /* TOOLBAR */
    .toolbar { max-width: 900px; margin: .9rem auto 0; padding: 0 1.1rem;
      display: flex; justify-content: space-between; align-items: center; gap: .6rem; flex-wrap: wrap; }
    .count-lbl { font-size: .82rem; color: var(--muted); font-style: italic; }
    .toolbar-right { display: flex; gap: .5rem; align-items: center; }
    .add-btn { background: var(--moss); color: #fff; border: none; padding: .52rem 1.1rem;
      border-radius: 8px; font-family: inherit; font-size: .88rem; font-weight: 700; cursor: pointer; transition: background .18s; }
    .add-btn:hover { background: var(--sage); }
    .reseed-btn { background: #fff3cd; color: #7a5a00; border: 1.5px solid #d4a017;
      padding: .42rem .9rem; border-radius: 8px; font-family: inherit; font-size: .78rem;
      font-weight: 700; cursor: pointer; transition: background .15s; }
    .reseed-btn:hover { background: #ffe9a0; }

    /* CARDS */
    .cards { max-width: 900px; margin: 1rem auto 3rem; padding: 0 1.1rem;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 1.1rem; }
    .card { background: #fff; border-radius: 14px; overflow: hidden;
      box-shadow: 0 2px 10px var(--shadow); border: 1px solid var(--border);
      border-top: 4px solid var(--sage); transition: transform .2s, box-shadow .2s;
      animation: fadeUp .3s ease both; }
    .card.bird { border-top-color: var(--sky); }
    .card:hover { transform: translateY(-3px); box-shadow: 0 6px 22px rgba(50,50,30,.14); }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

    /* PHOTO CAROUSEL */
    .photo-wrap { position: relative; width: 100%; height: 175px; background: var(--sage-bg); overflow: hidden; }
    .card.bird .photo-wrap { background: var(--sky-bg); }
    .photo-wrap img { width: 100%; height: 100%; object-fit: cover; transition: opacity .25s; }
    .photo-placeholder { width: 100%; height: 175px; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; }
    .photo-nav { position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(0,0,0,.38); color: #fff; border: none; border-radius: 50%;
      width: 28px; height: 28px; font-size: .8rem; cursor: pointer; display: none;
      align-items: center; justify-content: center; }
    .photo-nav.prev { left: 5px; }
    .photo-nav.next { right: 5px; }
    .photo-wrap:hover .photo-nav { display: flex; }
    .photo-counter { position: absolute; bottom: 5px; right: 7px; background: rgba(0,0,0,.5);
      color: #fff; font-size: .65rem; padding: 2px 7px; border-radius: 10px; }

    /* CARD BODY */
    .card-body { padding: .85rem 1rem .75rem; }
    .card-badge { display: inline-block; font-size: .62rem; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; padding: .18rem .5rem; border-radius: 4px; margin-bottom: .3rem;
      background: var(--sage-bg); color: var(--moss); }
    .card.bird .card-badge { background: var(--sky-bg); color: var(--sky); }
    .card-jp  { font-size: 1.05rem; font-weight: 700; line-height: 1.3; color: var(--moss); }
    .card.bird .card-jp { color: #1c4a7a; }
    .card-en  { font-family: 'Lora', serif; font-style: italic; font-size: .82rem; color: var(--muted); margin-top: .1rem; }
    .card-sci { font-family: 'Lora', serif; font-style: italic; font-size: .72rem; color: #aaa; }

    .info-section { margin-top: .6rem; }
    .info-row { display: flex; gap: .5rem; margin-bottom: .38rem; font-size: .78rem; align-items: flex-start; line-height: 1.55; }
    .info-lbl { flex-shrink: 0; font-size: .66rem; font-weight: 700; letter-spacing: .04em;
      padding: .14rem .5rem; border-radius: 4px; margin-top: .1rem; white-space: nowrap; }
    .flower .info-lbl, .card:not(.bird) .info-lbl { background: var(--sage-bg); color: var(--moss); }
    .card.bird .info-lbl { background: var(--sky-bg); color: var(--sky); }
    .info-txt { color: var(--mid); }

    .highlight-box { margin-top: .65rem; padding: .55rem .7rem; border-radius: 8px;
      font-size: .75rem; line-height: 1.6; }
    .card:not(.bird) .highlight-box { background: var(--sage-bg); color: #2a4a22; }
    .card.bird       .highlight-box { background: var(--sky-bg);  color: #1a3a60; }

    .tags { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .55rem; }
    .tag { font-size: .66rem; font-weight: 700; padding: .2rem .6rem; border-radius: 10px;
      background: var(--warm); color: var(--mid); border: 1px solid var(--border); }

    .card-meta { margin-top: .55rem; font-size: .75rem; color: var(--muted);
      display: flex; flex-wrap: wrap; gap: .3rem .8rem; border-top: 1px dashed var(--border); padding-top: .5rem; }
    .card-memo { margin-top: .4rem; font-size: .77rem; color: var(--mid);
      border-left: 2px solid var(--sage-lt); padding-left: .5rem; line-height: 1.5; }
    .card.bird .card-memo { border-color: var(--sky-lt); }

    .card-actions { display: flex; gap: .4rem; margin-top: .65rem; }
    .btn-edit, .btn-del { flex: 1; padding: .32rem; border-radius: 6px; border: none;
      cursor: pointer; font-size: .75rem; font-family: inherit; transition: background .15s; }
    .btn-edit { background: var(--warm); color: var(--mid); }
    .btn-edit:hover { background: #e4ddd0; }
    .btn-del  { background: #fce8e8; color: #b00; }
    .btn-del:hover  { background: #f8d0d0; }

    /* MODAL */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(25,30,18,.55);
      backdrop-filter: blur(3px); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--cream); border-radius: 18px; padding: 1.6rem 1.5rem 1.4rem;
      width: 100%; max-width: 500px; max-height: 92vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.28); animation: modalIn .22s ease; }
    @keyframes modalIn { from { opacity:0; transform:scale(.95) translateY(8px); } to { opacity:1; transform:scale(1) translateY(0); } }
    .modal h2 { font-family: 'Lora', serif; font-size: 1.1rem; margin-bottom: 1.1rem; color: var(--moss); }
    .modal.bird-mode h2 { color: var(--sky); }
    .form-section-title { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted); margin: 1rem 0 .5rem; padding-bottom: .25rem; border-bottom: 1px solid var(--border); }
    .form-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
    .form-group { margin-bottom: .65rem; }
    .form-group label { display: block; font-size: .75rem; font-weight: 700; color: var(--muted);
      margin-bottom: .25rem; letter-spacing: .04em; text-transform: uppercase; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: .5rem .7rem; border: 1.5px solid var(--border);
      border-radius: 8px; background: #fff; font-family: inherit; font-size: .87rem;
      color: var(--ink); outline: none; transition: border-color .18s; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--sage); }
    .bird-mode .form-group input:focus, .bird-mode .form-group textarea:focus { border-color: var(--sky); }
    .form-group textarea { min-height: 68px; resize: vertical; line-height: 1.55; }
    /* Tags input */
    .tags-input-wrap { display: flex; flex-wrap: wrap; gap: .35rem; padding: .4rem .5rem;
      border: 1.5px solid var(--border); border-radius: 8px; background: #fff; min-height: 38px; align-items: center; }
    .tags-input-wrap input { border: none; outline: none; font-family: inherit; font-size: .85rem;
      flex: 1; min-width: 80px; background: transparent; padding: .1rem .2rem; }
    .tag-chip { font-size: .72rem; background: var(--sage-bg); color: var(--moss); padding: .18rem .5rem;
      border-radius: 10px; display: inline-flex; align-items: center; gap: .3rem; font-weight: 700; }
    .bird-mode .tag-chip { background: var(--sky-bg); color: var(--sky); }
    .tag-chip button { background: none; border: none; cursor: pointer; font-size: .7rem;
      color: inherit; opacity: .7; padding: 0; line-height: 1; }
    /* Photos list */
    .photos-list { display: flex; flex-direction: column; gap: .4rem; }
    .photo-row { display: flex; gap: .4rem; align-items: center; }
    .photo-row input { flex: 1; padding: .45rem .65rem; border: 1.5px solid var(--border);
      border-radius: 7px; font-family: inherit; font-size: .82rem; outline: none; }
    .photo-row input:focus { border-color: var(--sage); }
    .btn-remove-photo { background: #fce8e8; color: #b00; border: none; border-radius: 6px;
      width: 28px; height: 28px; cursor: pointer; font-size: .9rem; flex-shrink: 0; }
    .btn-add-photo { background: var(--warm); color: var(--mid); border: 1.5px dashed var(--border);
      border-radius: 7px; padding: .42rem .8rem; font-family: inherit; font-size: .8rem;
      cursor: pointer; margin-top: .3rem; transition: background .15s; }
    .btn-add-photo:hover { background: #e4ddd0; }
    /* Modal actions */
    .modal-actions { display: flex; gap: .75rem; margin-top: 1.2rem; }
    .btn-save { flex: 2; background: var(--moss); color: #fff; border: none; border-radius: 9px;
      padding: .68rem; font-family: inherit; font-size: .98rem; font-weight: 700; cursor: pointer; transition: background .18s; }
    .btn-save:hover { background: var(--sage); }
    .bird-mode .btn-save { background: var(--sky); }
    .bird-mode .btn-save:hover { background: #4d8cc8; }
    .btn-cancel { flex: 1; background: var(--warm); color: var(--muted); border: none; border-radius: 9px;
      padding: .68rem; font-family: inherit; font-size: .9rem; cursor: pointer; }
    .btn-cancel:hover { background: #e4ddd0; }

    /* CONFIRM DIALOG */
    .confirm-bg { display: none; position: fixed; inset: 0; background: rgba(25,30,18,.6);
      z-index: 300; align-items: center; justify-content: center; padding: 1rem; }
    .confirm-bg.open { display: flex; }
    .confirm-box { background: #fff; border-radius: 14px; padding: 1.5rem; max-width: 380px;
      width: 100%; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.2); }
    .confirm-box h3 { font-size: 1rem; margin-bottom: .6rem; }
    .confirm-box p  { font-size: .83rem; color: var(--muted); line-height: 1.6; margin-bottom: 1.1rem; }
    .confirm-btns { display: flex; gap: .6rem; }
    .btn-confirm-yes { flex: 1; background: #d44; color: #fff; border: none; padding: .6rem;
      border-radius: 8px; font-family: inherit; font-size: .9rem; font-weight: 700; cursor: pointer; }
    .btn-confirm-no  { flex: 1; background: var(--warm); color: var(--mid); border: none;
      padding: .6rem; border-radius: 8px; font-family: inherit; font-size: .9rem; cursor: pointer; }

    /* TOAST */
    .toast { position: fixed; bottom: 1.6rem; right: 1.6rem; background: var(--ink); color: #fff;
      padding: .6rem 1.2rem; border-radius: 9px; font-size: .85rem; z-index: 400;
      opacity: 0; pointer-events: none; transform: translateY(6px);
      transition: opacity .28s, transform .28s; }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* LOADING */
    .loading-state { grid-column: 1/-1; text-align: center; padding: 3rem 1rem;
      color: var(--muted); font-style: italic; }

    @media (max-width: 480px) {
      .cards { grid-template-columns: 1fr; }
      .form-row2 { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>

<header>
  <h1>🌿 ダラス散歩 花と鳥のデータベース</h1>
  <p>Dallas Nature Walk · Flowers &amp; Birds</p>
  <div class="header-stats">
    <div class="stat-box"><div class="stat-num" id="stat-flower">—</div><div class="stat-lbl">花・植物</div></div>
    <div class="stat-box"><div class="stat-num" id="stat-bird">—</div><div class="stat-lbl">鳥</div></div>
    <div class="stat-box"><div class="stat-num" id="stat-total">—</div><div class="stat-lbl">合計</div></div>
  </div>
</header>

<div class="tab-bar">
  <button class="tab active"   id="tab-flower" onclick="switchTab('flower')">🌸 花・植物</button>
  <button class="tab bird-tab" id="tab-bird"   onclick="switchTab('bird')">🐦 鳥</button>
</div>

<div class="toolbar">
  <span class="count-lbl" id="count-lbl">読み込み中…</span>
  <div class="toolbar-right">
    <button class="reseed-btn" id="reseed-btn" style="display:none" onclick="offerReseed()">🔄 詳細データに更新</button>
    <button class="add-btn" onclick="openModal()">＋ 追加</button>
  </div>
</div>

<div class="cards" id="cards-container">
  <div class="loading-state">データを読み込み中…</div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg" onclick="bgClick(event)">
  <div class="modal" id="modal-inner">
    <h2 id="modal-title">🌸 新しい花を追加</h2>

    <div class="form-section-title">基本情報</div>
    <div class="form-row2">
      <div class="form-group"><label>日本語名 *</label><input id="f-jp" type="text" placeholder="例：サルスベリ"></div>
      <div class="form-group"><label>英語名 *</label><input id="f-en" type="text" placeholder="例：Crape Myrtle"></div>
    </div>
    <div class="form-group"><label>学名</label><input id="f-sci" type="text" placeholder="例：Lagerstroemia indica"></div>

    <div class="form-section-title">詳細情報</div>
    <div class="form-group"><label>原産地・由来</label><input id="f-origin" type="text" placeholder="例：中国・東アジア"></div>
    <div class="form-group"><label>特徴</label><textarea id="f-features" placeholder="植物・鳥の特徴を入力…"></textarea></div>
    <div class="form-group"><label>ハイライト・メモ</label><textarea id="f-highlight" placeholder="気づいたこと、豆知識など…"></textarea></div>

    <div class="form-section-title">記録</div>
    <div class="form-row2">
      <div class="form-group"><label>見かけた日</label><input id="f-date" type="date"></div>
      <div class="form-group"><label>場所</label><input id="f-loc" type="text" placeholder="例：Pacific Plaza"></div>
    </div>
    <div class="form-group"><label>その他メモ</label><textarea id="f-memo" placeholder="その他メモ…" style="min-height:52px"></textarea></div>

    <div class="form-section-title">タグ</div>
    <div class="form-group">
      <label>タグ（入力してEnterで追加）</label>
      <div class="tags-input-wrap" id="tags-wrap">
        <input id="tag-input" type="text" placeholder="例：テキサス原産" onkeydown="tagKeydown(event)">
      </div>
    </div>

    <div class="form-section-title">写真（Google Drive URL）</div>
    <div class="photos-list" id="photos-list"></div>
    <button class="btn-add-photo" onclick="addPhotoRow()">＋ 写真URLを追加</button>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-save" onclick="saveEntry()">保存する</button>
    </div>
  </div>
</div>

<!-- CONFIRM DIALOG -->
<div class="confirm-bg" id="confirm-bg">
  <div class="confirm-box">
    <h3 id="confirm-title">確認</h3>
    <p id="confirm-msg"></p>
    <div class="confirm-btns">
      <button class="btn-confirm-no"  onclick="closeConfirm()">キャンセル</button>
      <button class="btn-confirm-yes" id="confirm-yes-btn">実行する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">

/* ── FULL SEED DATA ── */

  { jp:"マンデビラ", en:"Mandevilla / Brazilian Jasmine", sci:"Mandevilla spp.",

    features:"つる性の植物。白・ピンク・赤・複色など豊富な花色。暑さに非常に強くダラスの夏の定番。Mandevilla＝Dipladenia（旧名）＝Brazilian Jasmineはすべて同じ植物。",

  { jp:"マンデビラ「赤ずきんちゃん」品種", en:"Mandevilla Red Riding Hood", sci:"Mandevilla sanderi 'Red Riding Hood'",

let tab      = 'flower';
let allData  = { flower:{}, bird:{} };
let editKey  = null;
let currentTags  = [];
let photoRows    = 0;
let confirmCb    = null;

/* ── GOOGLE DRIVE URL ── */
function driveUrl(url) {
  if (!url) return null;
  const m = url.match(/\/file\/d\/([^/?#]+)/);
  if (m) return `https://lh3.googleusercontent.com/d/${m[1]}`;
  const m2 = url.match(/[?&]id=([^&]+)/);
  if (m2) return `https://lh3.googleusercontent.com/d/${m2[1]}`;
  return url;
}

/* ── SEED ── */
async function seedAll() {
  await set(ref(db,'flowers'), null);
  await set(ref(db,'birds'),   null);
  for (const f of SEED_FLOWERS)
    await push(ref(db,'flowers'), { ...f, category:'flower', tags: f.tags||[], photos: f.photos||[] });
  for (const b of SEED_BIRDS)
    await push(ref(db,'birds'),   { ...b, category:'bird',   tags: b.tags||[], photos: b.photos||[] });
  toast('詳細データ（22花・5鳥）を登録しました ✓');
}

async function initData() {
  const snap = await get(child(ref(db),'flowers'));
  if (!snap.exists()) {
    await seedAll();
    return;
  }
  const first = Object.values(snap.val())[0];
  if (!first.features) {
    document.getElementById('reseed-btn').style.display = '';
  }
}

/* ── LISTENERS ── */
function startListeners() {
  onValue(ref(db,'flowers'), s => {
    allData.flower = s.val() || {};
    updateStats();
    if (tab === 'flower') render();
  });
  onValue(ref(db,'birds'), s => {
    allData.bird = s.val() || {};
    updateStats();
    if (tab === 'bird') render();
  });
}

function updateStats() {
  const fc = Object.keys(allData.flower).length;
  const bc = Object.keys(allData.bird).length;
  document.getElementById('stat-flower').textContent = fc;
  document.getElementById('stat-bird'  ).textContent = bc;
  document.getElementById('stat-total' ).textContent = fc + bc;
}

/* ── RENDER ── */
function render() {
  const container = document.getElementById('cards-container');
  const entries   = Object.entries(allData[tab]);
  const isFlower  = tab === 'flower';
  document.getElementById('count-lbl').textContent =
    isFlower ? `🌸 花・植物 ${entries.length}種類` : `🐦 鳥 ${entries.length}種類`;

  if (!entries.length) {
    container.innerHTML = '<div class="loading-state">データがありません</div>';
    return;
  }

  container.innerHTML = entries.map(([key, item], i) => {
    const photos   = Array.isArray(item.photos) ? item.photos.filter(Boolean) : [];
    const hasPhoto = photos.length > 0;
    const mainImg  = hasPhoto ? driveUrl(photos[0]) : null;
    const delay    = Math.min(i * 0.035, 0.45).toFixed(2);
    const emoji    = isFlower ? '🌸' : '🐦';
    const tags     = Array.isArray(item.tags) ? item.tags : [];

    return `
<div class="card ${isFlower?'':'bird'}" style="animation-delay:${delay}s" id="card-${key}">
  <div class="photo-wrap" id="pw-${key}">
    ${hasPhoto
      ? `<img src="${mainImg}" alt="${item.jp}"
              onerror="this.src=''; this.style.display='none'; document.getElementById('ph-${key}').style.display='flex'">
         <div id="ph-${key}" class="photo-placeholder" style="display:none">${emoji}</div>
         ${photos.length > 1 ? `
           <button class="photo-nav prev" onclick="photoNav('${key}',-1,${photos.length})">‹</button>
           <button class="photo-nav next" onclick="photoNav('${key}', 1,${photos.length})">›</button>
           <div class="photo-counter" id="pc-${key}">1 / ${photos.length}</div>` : ''}
        `
      : `<div class="photo-placeholder">${emoji}</div>`}
  </div>
  <div class="card-body">
    <div class="card-badge">${isFlower ? 'Flower' : 'Bird'}</div>
    <div class="card-jp">${item.jp||''}</div>
    <div class="card-en">${item.en||''}</div>
    <div class="card-sci">${item.sci||''}</div>
    <div class="info-section">
      ${item.origin    ? `<div class="info-row"><span class="info-lbl">原産</span><span class="info-txt">${item.origin}</span></div>` : ''}
      ${item.features  ? `<div class="info-row"><span class="info-lbl">特徴</span><span class="info-txt">${item.features}</span></div>` : ''}
    </div>
    ${item.highlight ? `<div class="highlight-box">💡 ${item.highlight}</div>` : ''}
    ${tags.length    ? `<div class="tags">${tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>` : ''}
    ${(item.date||item.location) ? `
      <div class="card-meta">
        ${item.date     ? `<span>📅 ${item.date}</span>` : ''}
        ${item.location ? `<span>📍 ${item.location}</span>` : ''}
      </div>` : ''}
    ${item.memo ? `<div class="card-memo">${item.memo}</div>` : ''}
    <div class="card-actions">
      <button class="btn-edit" onclick="editEntry('${key}')">✏️ 編集</button>
      <button class="btn-del"  onclick="askDelete('${key}')">🗑️ 削除</button>
    </div>
  </div>
</div>`;
  }).join('');
}

/* ── PHOTO NAV ── */
window.photoNav = function(key, dir, total) {
  if (!cardPhotoIdx[key]) cardPhotoIdx[key] = 0;
  const photos = Array.isArray(allData[tab][key]?.photos) ? allData[tab][key].photos.filter(Boolean) : [];
  cardPhotoIdx[key] = (cardPhotoIdx[key] + dir + total) % total;
  const idx = cardPhotoIdx[key];
  const wrap = document.getElementById('pw-' + key);
  if (!wrap) return;
  const img = wrap.querySelector('img');
  const ph  = document.getElementById('ph-' + key);
  const counter = document.getElementById('pc-' + key);
  if (img) { img.src = driveUrl(photos[idx]) || ''; img.style.display = ''; }
  if (ph)  { ph.style.display = 'none'; }
  if (counter) counter.textContent = `${idx+1} / ${total}`;
};

/* ── TAB SWITCH ── */
window.switchTab = function(t) {
  tab = t;
  cardPhotoIdx = {};
  document.getElementById('tab-flower').classList.toggle('active', t==='flower');
  document.getElementById('tab-bird'  ).classList.toggle('active', t==='bird');
  render();
};

/* ── MODAL OPEN/CLOSE ── */
window.openModal = function() {
  editKey = null;
  clearForm();
  syncModalMode();
  document.getElementById('modal-bg').classList.add('open');
};
window.closeModal = function() {
  document.getElementById('modal-bg').classList.remove('open');
  editKey = null;
};
window.bgClick = function(e) {
  if (e.target === document.getElementById('modal-bg')) closeModal();
};

function syncModalMode() {
  const isFlower = tab === 'flower';
  document.getElementById('modal-inner').classList.toggle('bird-mode', !isFlower);
  document.getElementById('modal-title').textContent =
    editKey
      ? (isFlower ? '🌸 花・植物を編集' : '🐦 鳥を編集')
      : (isFlower ? '🌸 新しい花・植物を追加' : '🐦 新しい鳥を追加');
}

function clearForm() {
  ['f-jp','f-en','f-sci','f-origin','f-features','f-highlight','f-date','f-loc','f-memo']
    .forEach(id => document.getElementById(id).value = '');
  currentTags = [];
  renderTagChips();
  document.getElementById('photos-list').innerHTML = '';
  photoRows = 0;
}

/* ── EDIT ── */
window.editEntry = function(key) {
  const d = allData[tab][key];
  if (!d) return;
  editKey = key;
  document.getElementById('f-jp'       ).value = d.jp        || '';
  document.getElementById('f-en'       ).value = d.en        || '';
  document.getElementById('f-sci'      ).value = d.sci       || '';
  document.getElementById('f-origin'   ).value = d.origin    || '';
  document.getElementById('f-features' ).value = d.features  || '';
  document.getElementById('f-highlight').value = d.highlight || '';
  document.getElementById('f-date'     ).value = d.date      || '';
  document.getElementById('f-loc'      ).value = d.location  || '';
  document.getElementById('f-memo'     ).value = d.memo      || '';
  currentTags = Array.isArray(d.tags) ? [...d.tags] : [];
  renderTagChips();
  document.getElementById('photos-list').innerHTML = '';
  photoRows = 0;
  const photos = Array.isArray(d.photos) ? d.photos.filter(Boolean) : [];
  photos.forEach(url => addPhotoRow(url));
  syncModalMode();
  document.getElementById('modal-bg').classList.add('open');
};

/* ── DELETE ── */
window.askDelete = function(key) {
  const name = allData[tab][key]?.jp || 'このデータ';
  showConfirm(`「${name}」を削除しますか？`, 'この操作は元に戻せません。', () => {
    const path = tab === 'flower' ? 'flowers' : 'birds';
    remove(ref(db, `${path}/${key}`)).then(() => toast('削除しました'));
  });
};

/* ── SAVE ── */
window.saveEntry = function() {
  const jp = document.getElementById('f-jp').value.trim();
  const en = document.getElementById('f-en').value.trim();
  if (!jp || !en) { alert('日本語名と英語名は必須です'); return; }

  const photos = Array.from(document.querySelectorAll('.photo-row input'))
    .map(i => i.value.trim()).filter(Boolean);

  const entry = {
    jp, en,
    sci:       document.getElementById('f-sci'      ).value.trim(),
    origin:    document.getElementById('f-origin'   ).value.trim(),
    features:  document.getElementById('f-features' ).value.trim(),
    highlight: document.getElementById('f-highlight').value.trim(),
    date:      document.getElementById('f-date'     ).value,
    location:  document.getElementById('f-loc'      ).value.trim(),
    memo:      document.getElementById('f-memo'     ).value.trim(),
    tags:      [...currentTags],
    photos,
    category: tab,
  };

  const path = tab === 'flower' ? 'flowers' : 'birds';
  if (editKey) {
    update(ref(db, `${path}/${editKey}`), entry)
      .then(() => { toast('更新しました ✓'); closeModal(); });
  } else {
    push(ref(db, path), entry)
      .then(() => { toast('追加しました ✓'); closeModal(); });
  }
};

/* ── TAGS ── */
window.tagKeydown = function(e) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = e.target.value.trim().replace(/,/g,'');
    if (val && !currentTags.includes(val)) {
      currentTags.push(val);
      renderTagChips();
    }
    e.target.value = '';
  }
};
window.removeTag = function(i) {
  currentTags.splice(i, 1);
  renderTagChips();
};
function renderTagChips() {
  const wrap = document.getElementById('tags-wrap');
  const input = document.getElementById('tag-input');
  wrap.innerHTML = '';
  currentTags.forEach((t, i) => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip';
    chip.innerHTML = `${t} <button onclick="removeTag(${i})">×</button>`;
    wrap.appendChild(chip);
  });
  wrap.appendChild(input);
}

/* ── PHOTOS ── */
window.addPhotoRow = function(val = '') {
  photoRows++;
  const id  = 'pr-' + photoRows;
  const row = document.createElement('div');
  row.className = 'photo-row';
  row.id = id;
  row.innerHTML = `
    <input type="url" placeholder="https://drive.google.com/file/d/.../view" value="${val}">
    <button class="btn-remove-photo" onclick="document.getElementById('${id}').remove()">✕</button>`;
  document.getElementById('photos-list').appendChild(row);
};

/* ── RESEED ── */
window.offerReseed = function() {
  showConfirm(
    '詳細データに更新しますか？',
    '現在のデータをすべて削除し、22種の花・5種の鳥の詳細データで上書きします。\n写真・追記したメモは失われます。',
    async () => {
      document.getElementById('reseed-btn').style.display = 'none';
      await seedAll();
    }
  );
};

/* ── CONFIRM DIALOG ── */
function showConfirm(title, msg, cb) {
  confirmCb = cb;
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg'  ).textContent = msg;
  document.getElementById('confirm-bg'   ).classList.add('open');
}
window.closeConfirm = function() {
  document.getElementById('confirm-bg').classList.remove('open');
  confirmCb = null;
};
document.getElementById('confirm-yes-btn').addEventListener('click', () => {
  closeConfirm();
  if (confirmCb) confirmCb();
});

/* ── TOAST ── */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}

/* ── INIT ── */
initData().then(() => startListeners());
</script>
</body>
</html>
